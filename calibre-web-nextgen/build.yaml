---
# Thin wrapper over the upstream multi-arch image. Same tag for both arches -
# Docker resolves the right platform from the manifest at build time.
build_from:
  amd64: ghcr.io/new-usemame/calibre-web-nextgen:latest
  aarch64: ghcr.io/new-usemame/calibre-web-nextgen:latest
labels:
  org.opencontainers.image.title: "Calibre-Web-NextGen (Home Assistant add-on)"
  org.opencontainers.image.description: >-
    HA add-on wrapper around ghcr.io/new-usemame/calibre-web-nextgen
  org.opencontainers.image.source: "https://github.com/andMaximus/hass-calibre-web-nextgen"
  org.opencontainers.image.licenses: "GPL-3.0-only"
