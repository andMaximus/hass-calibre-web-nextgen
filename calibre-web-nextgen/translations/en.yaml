---
configuration:
  PUID:
    name: User ID (PUID)
    description: >-
      UID that owns the config and library files. 0 (root) is simplest with a
      CIFS-mounted library; use 1000 for a local /share library.
  PGID:
    name: Group ID (PGID)
    description: GID counterpart to PUID.
  TZ:
    name: Timezone override
    description: >-
      e.g. Europe/Amsterdam. Leave blank to inherit the Home Assistant system
      timezone.
  ingest:
    name: Auto-import drop folder
    description: >-
      Optional. A folder (under /share, /media or /mnt/<share>) whose contents
      are converted and added to the library, then removed. Leave blank if unused.
  networkdisks:
    name: SMB/CIFS share(s)
    description: >-
      e.g. //192.168.2.223/Media/Books - mounted at /mnt/Books. Comma-separate
      for several. Leave blank if using NFS or a local library.
  cifsusername:
    name: SMB username
    description: Username for the SMB/CIFS share(s).
  cifspassword:
    name: SMB password
    description: >-
      Password for the SMB/CIFS share(s). Any characters are fine - it is passed
      through a credentials file, not the command line.
  cifsdomain:
    name: SMB domain / workgroup
    description: Optional SMB workgroup or domain.
  nfsdisks:
    name: NFS share(s)
    description: >-
      host:/export, e.g. 192.168.2.223:/Media - mounted at /mnt/Media. Prefer
      this over SMB when metadata.db lives on the share: NFSv4 gives SQLite
      reliable locking. Comma-separate for several. NAS must export NFSv4 and
      allow this host (no root squash).
