---
name: Calibre-Web-NextGen
version: "0.4.1"
slug: calibre_web_nextgen
description: >-
  eBook library + reader. Actively-maintained fork of Calibre-Web-Automated:
  bundled Calibre, Kobo Sync, a built-in KOReader kosync server, and one-switch
  Hardcover reading-progress sync - so a Kobo and a KOReader device stay in sync
  through one hub. Optional SMB/CIFS library mounting.
url: https://github.com/andMaximus/hass-calibre-web-nextgen/tree/main/calibre-web-nextgen
stage: stable
# Upstream image is amd64 + arm64 only (no armv7). Built locally by Supervisor
# from ./Dockerfile (a thin wrapper over the upstream image) - no registry needed.
arch:
  - amd64
  - aarch64
# The upstream image ships its own s6-overlay init at /init - let it run.
init: false
# Serve the UI through the HA sidebar. Ingress hits the in-container nginx shim
# on 8099, which rewrites X-Ingress-Path so calibre-web works under the subpath.
ingress: true
ingress_port: 8099
ingress_stream: true
panel_icon: mdi:bookshelf
panel_title: Calibre-Web
# Expose 8083 on the host so devices outside HA (Kobo / KOReader over Tailscale)
# can reach the Kobo Sync + kosync endpoints. Set to null to disable.
ports:
  8083/tcp: 8083
ports_description:
  8083/tcp: >-
    Web UI + Kobo Sync + KOReader kosync endpoints. Keep mapped if devices
    connect from outside Home Assistant (e.g. over Tailscale).
map:
  - type: share
    read_only: false
  - type: media
    read_only: false
  - type: addon_config
    read_only: false
    path: /config
# mount(2) for CIFS needs SYS_ADMIN; DAC_READ_SEARCH helps traverse the share.
# apparmor.txt in this folder is auto-loaded by Supervisor (profile name matches
# the slug); it permits `mount` while confining the rest, so AppArmor stays on.
privileged:
  - SYS_ADMIN
  - DAC_READ_SEARCH
apparmor: true
options:
  PUID: 0
  PGID: 0
  TZ: ""
  networkdisks: ""
  cifsusername: ""
  cifspassword: ""
  cifsdomain: ""
schema:
  PUID: int
  PGID: int
  TZ: "str?"
  networkdisks: "str?"
  cifsusername: "str?"
  cifspassword: "str?"
  cifsdomain: "str?"
