name: Track upstream NextGen releases

on:
  schedule:
    - cron: "23 */6 * * *"   # every 6 hours
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["calibre-web-nextgen/**"]

permissions:
  contents: write
  packages: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Resolve latest upstream release
        id: up
        run: |
          tag=$(curl -fsSL -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/new-usemame/Calibre-Web-NextGen/releases/latest" \
            | jq -r '.tag_name // empty')
          if [ -z "$tag" ] || [ "$tag" = "null" ]; then
            echo "could not resolve upstream release"; exit 1
          fi
          echo "tag=$tag"       >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Read current pinned upstream image
        id: cur
        run: |
          # source of truth for "which upstream are we on" is the Dockerfile image
          # tag, not config.yaml (that can carry a wrapper-only .N suffix)
          cur=$(grep -oE 'calibre-web-nextgen:v[0-9][0-9.]*' calibre-web-nextgen/Dockerfile | head -1 | sed 's/.*:v//')
          echo "version=$cur" >> "$GITHUB_OUTPUT"

      - name: Bump to upstream release
        if: steps.up.outputs.version != steps.cur.outputs.version
        env:
          NEW: ${{ steps.up.outputs.version }}
          TAG: ${{ steps.up.outputs.tag }}
        run: |
          set -euo pipefail
          cd calibre-web-nextgen

          sed -i -E "s|^version:.*|version: \"${NEW}\"|" config.yaml
          sed -i -E "s|(ghcr\.io/new-usemame/calibre-web-nextgen:)[^\"]*|\1${TAG}|" Dockerfile

          {
            echo "# Changelog"
            echo
            echo "## ${NEW}"
            echo
            echo "- Track upstream Calibre-Web-NextGen [\`${TAG}\`](https://github.com/new-usemame/Calibre-Web-NextGen/releases/tag/${TAG})."
            echo
            tail -n +2 CHANGELOG.md
          } > CHANGELOG.md.new
          mv CHANGELOG.md.new CHANGELOG.md

          cd ..

      # Prebuilt images: Supervisor pulls ghcr.io/andmaximus/<arch>-hass-calibre-web-nextgen:<version>
      # (config.yaml `image:`) instead of building on the user's Pi. The image MUST
      # exist before the version bump is pushed, or HA would offer an update that
      # cannot be installed - so build first, commit after.
      - name: Read add-on version
        id: ver
        run: |
          v=$(awk -F'"' '/^version:/{print $2; exit}' calibre-web-nextgen/config.yaml)
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Check whether images already exist
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          img=ghcr.io/andmaximus; v="${{ steps.ver.outputs.version }}"
          if docker buildx imagetools inspect "$img/aarch64-hass-calibre-web-nextgen:$v" >/dev/null 2>&1 \
             && docker buildx imagetools inspect "$img/amd64-hass-calibre-web-nextgen:$v" >/dev/null 2>&1; then
            echo "built=true" >> "$GITHUB_OUTPUT"
          else
            echo "built=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-qemu-action@v3
        if: steps.exists.outputs.built == 'false'
      - uses: docker/setup-buildx-action@v3
        if: steps.exists.outputs.built == 'false'

      - name: Build and push per-arch images
        if: steps.exists.outputs.built == 'false'
        run: |
          set -euo pipefail
          v="${{ steps.ver.outputs.version }}"
          for pair in amd64:linux/amd64 aarch64:linux/arm64; do
            arch="${pair%%:*}"; platform="${pair##*:}"
            docker buildx build \
              --platform "$platform" \
              --push \
              -t "ghcr.io/andmaximus/${arch}-hass-calibre-web-nextgen:${v}" \
              -t "ghcr.io/andmaximus/${arch}-hass-calibre-web-nextgen:latest" \
              calibre-web-nextgen
          done

      - name: Commit and push version bump
        if: steps.up.outputs.version != steps.cur.outputs.version
        env:
          TAG: ${{ steps.up.outputs.tag }}
        run: |
          git config user.name  "andMaximus"
          git config user.email "72256503+andMaximus@users.noreply.github.com"
          git add -A
          git commit -m "chore: track upstream NextGen ${TAG}"
          git push
