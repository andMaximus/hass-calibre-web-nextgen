name: Track upstream NextGen releases

on:
  schedule:
    - cron: "23 */6 * * *"   # every 6 hours
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["calibre-web-nextgen/**"]

permissions:
  contents: write
  packages: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

env:
  IMAGE_PREFIX: ghcr.io/andmaximus

jobs:
  # 1. Work out whether upstream moved; if so, apply the bump to the files (NOT
  #    committed yet) and hand the resulting add-on folder to the later jobs.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      bump: ${{ steps.flags.outputs.bump }}
      tag: ${{ steps.up.outputs.tag }}
    steps:
      - uses: actions/checkout@v5

      - name: Resolve latest upstream release
        id: up
        run: |
          tag=$(curl -fsSL -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/new-usemame/Calibre-Web-NextGen/releases/latest" \
            | jq -r '.tag_name // empty')
          if [ -z "$tag" ] || [ "$tag" = "null" ]; then
            echo "could not resolve upstream release"; exit 1
          fi
          echo "tag=$tag"         >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Read current pinned upstream image
        id: cur
        run: |
          # source of truth for "which upstream are we on" is the Dockerfile image
          # tag, not config.yaml (that can carry a wrapper-only .N suffix)
          cur=$(grep -oE 'calibre-web-nextgen:v[0-9][0-9.]*' calibre-web-nextgen/Dockerfile | head -1 | sed 's/.*:v//')
          echo "version=$cur" >> "$GITHUB_OUTPUT"

      - name: Flag bump
        id: flags
        run: |
          if [ "${{ steps.up.outputs.version }}" != "${{ steps.cur.outputs.version }}" ]; then
            echo "bump=true"  >> "$GITHUB_OUTPUT"
          else
            echo "bump=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply bump to files (not committed)
        if: steps.flags.outputs.bump == 'true'
        env:
          NEW: ${{ steps.up.outputs.version }}
          TAG: ${{ steps.up.outputs.tag }}
        run: |
          set -euo pipefail
          cd calibre-web-nextgen

          sed -i -E "s|^version:.*|version: \"${NEW}\"|" config.yaml
          sed -i -E "s|(ghcr\.io/new-usemame/calibre-web-nextgen:)[^\"]*|\1${TAG}|" Dockerfile

          {
            echo "# Changelog"
            echo
            echo "## ${NEW}"
            echo
            echo "- Track upstream Calibre-Web-NextGen [\`${TAG}\`](https://github.com/new-usemame/Calibre-Web-NextGen/releases/tag/${TAG})."
            echo
            tail -n +2 CHANGELOG.md
          } > CHANGELOG.md.new
          mv CHANGELOG.md.new CHANGELOG.md

      - name: Read add-on version
        id: ver
        run: |
          v=$(awk -F'"' '/^version:/{print $2; exit}' calibre-web-nextgen/config.yaml)
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: addon
          path: calibre-web-nextgen
          retention-days: 1

  # 2. One job per architecture, each on a native runner (no QEMU). A failure in
  #    one arch does not cancel the other, and a failed arch can be re-run alone.
  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            platform: linux/amd64
          - arch: aarch64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: addon
          path: calibre-web-nextgen

      - name: Log in to GHCR
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Check whether this image already exists
        id: exists
        run: |
          img="${IMAGE_PREFIX}/${{ matrix.arch }}-hass-calibre-web-nextgen:${{ needs.prepare.outputs.version }}"
          if docker buildx imagetools inspect "$img" >/dev/null 2>&1; then
            echo "built=true"  >> "$GITHUB_OUTPUT"
          else
            echo "built=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        if: steps.exists.outputs.built == 'false'
        run: |
          set -euo pipefail
          base="${IMAGE_PREFIX}/${{ matrix.arch }}-hass-calibre-web-nextgen"
          v="${{ needs.prepare.outputs.version }}"
          docker build \
            --platform "${{ matrix.platform }}" \
            -t "$base:$v" \
            -t "$base:latest" \
            calibre-web-nextgen
          docker push "$base:$v"
          docker push "$base:latest"

  # 3. Only after BOTH images exist, commit the bump so HA never offers an
  #    update it cannot install.
  commit:
    needs: [prepare, build]
    if: needs.prepare.outputs.bump == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v7
        with:
          name: addon
          path: calibre-web-nextgen

      - name: Commit and push version bump
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          git config user.name  "andMaximus"
          git config user.email "72256503+andMaximus@users.noreply.github.com"
          git add -A
          git commit -m "chore: track upstream NextGen ${TAG}"
          git pull --rebase
          git push
